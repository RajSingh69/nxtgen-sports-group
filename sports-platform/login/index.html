<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Private NXT Gen Sports Platform foundation.">
  <title>Sports Platform Login | NXT Gen Sports Group</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/sports-platform.css">
</head>
<body class="sports-platform-app" data-platform-route="login">
<header class="sports-app-header">
  <a class="sports-app-brand" href="../../"><img src="../../assets/nxtGenSportsLogo.webp" alt="NXT Gen Sports Group"><span>Sports Platform</span></a>
  <div class="sports-user-cluster"><div data-sports-user></div><button type="button" data-sports-sign-out>Sign out</button></div>
</header>
<main class="sports-app-shell" data-sports-app>
  <p class="sports-message" data-sports-message role="status" aria-live="polite" hidden></p>
        <section class="sports-login-card">
        <div><p class="eyebrow">Private platform</p><h1>Sign in to NXT Gen Sports Platform.</h1><p>No public registration is available. Accounts are created by NXT Gen only.</p></div>
        <form data-sports-login-form>
          <label>Email<input type="email" name="email" autocomplete="email" required></label>
          <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
          <button class="sports-button" type="submit">Sign in</button>
          <button class="sports-link-button" type="button" data-sports-reset>Forgot password</button>
        </form>
      </section>
</main>
<script type="module" src="../../js/sports-platform.js"></script>
</body>
</html>
